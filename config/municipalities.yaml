  - id: gangjin-county
    name: 강진군청 보도자료
    region: 전남광주통합특별시 강진
    # 2026-07-30 사용자 지시로 당분간 자동 수집에서 제외한다.
    # 이유: 연결이 매번 실패하는데 실패 기관 자동 재검증까지 끌려가 자동 수집 회차가
    # 완주하지 못했다. 완주하지 못하면 Gemini 초안 큐를 비우는 유지보수가 돌지 않아
    # 초안 변환이 함께 멈춘다(당시 검수 대기 237건, 자동 완료 기록 8시간 정지).
    # 되살리는 조건: 중계 경유(Cloudflare Worker 또는 한국 VPS)가 준비되거나
    # 상대 정책이 바뀌어 싱가포르에서 연결이 되는 것이 확인되면 true로 되돌린다.
    # 필수 기관 목록에는 그대로 남겨 두어 운영 화면이 "비활성화" 경고로 계속 상기시킨다.
    enabled: false
    type: html_board
    verify_ssl: false
    # 싱가포르 서버에서만 연결이 응답 없이 끊긴다. 2026-07-30 실측으로 아래를 모두 기각했다.
    #  - "해외 IP 전체 차단": 국내 PC와 무관한 해외 인프라 둘 다 200 정상
    #  - 연결 시간 부족: TLS 핸드셰이크 0.15초 (제한 8초와 거리가 멀다)
    #  - IPv6 경로: AAAA 레코드 없음 (A만, 152.99.169.57)
    #  - 봇 UA 차단: 브라우저 UA로 바꿔 배포했으나 실패 누적 120 -> 121로 그대로 실패
    # 남은 수단은 중계 경유(Cloudflare Worker 또는 한국 VPS)뿐이라 미해결로 둔다.
    # 서버가 매시간 재시도하므로 상대 정책이 바뀌면 자동으로 살아난다.
    list_url: "https://www.gangjin.go.kr/www/government/news/press"
    fallback_urls:
      - "https://www.gangjin.go.kr/www/government/press"
      - "http://www.gangjin.go.kr/www/ijwok1@"
    include_url_contains:
      - "/www/government/press"
      - "/www/government/news/press"
      - "mode=view"
    selectors:
      link: "a[href*='mode=view'][href*='idx=']"
      title_attr: "title"
      content: *common_content

