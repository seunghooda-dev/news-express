name: Render deploy fallback

"on":
  push:
    branches:
      - codex/news-express
  workflow_dispatch:

concurrency:
  group: render-deploy-fallback
  cancel-in-progress: true

jobs:
  deploy:
    name: Trigger Render deploy hook
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Skip when deploy hook secret is not configured
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          echo "::notice::RENDER_DEPLOY_HOOK_URL secret is not configured. Render deploy fallback was skipped."

      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          response_code="$(curl -sS -o /tmp/render-deploy-response.txt -w '%{http_code}' -X POST "$RENDER_DEPLOY_HOOK_URL")"
          cat /tmp/render-deploy-response.txt
          if [ "$response_code" -lt 200 ] || [ "$response_code" -ge 300 ]; then
            echo "Render deploy hook failed with HTTP $response_code"
            exit 1
          fi
