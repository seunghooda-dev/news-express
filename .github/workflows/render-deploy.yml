name: Render deploy fallback

"on":
  push:
    branches:
      - codex/news-express
    paths:
      - src/**
      - config/**
      - scripts/**
      - templates/**
      - pyproject.toml
      - render.yaml
  workflow_dispatch:

concurrency:
  group: render-deploy-fallback
  cancel-in-progress: true

jobs:
  deploy:
    name: Trigger Render deploy hook
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Fail when deploy hook secret is not configured
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          echo "::error::RENDER_DEPLOY_HOOK_URL secret is not configured, so Render was NOT deployed. Set it in Settings → Secrets and variables → Actions (value: Render Deploy Hook URL)."
          exit 1

      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          response_code="$(curl -sS -o /tmp/render-deploy-response.txt -w '%{http_code}' -X POST "$RENDER_DEPLOY_HOOK_URL")"
          cat /tmp/render-deploy-response.txt
          if [ "$response_code" -lt 200 ] || [ "$response_code" -ge 300 ]; then
            echo "Render deploy hook failed with HTTP $response_code"
            exit 1
          fi
