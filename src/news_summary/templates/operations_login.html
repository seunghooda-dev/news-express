{% extends "base.html" %}
{% block content %}
<section class="auth-panel">
  <h1>운영 관리 확인</h1>
  <p class="meta">운영 로그, 백업, 자동 수집 설정은 관리자 비밀번호 확인 후 볼 수 있습니다.</p>
  <form method="post" action="{{ url_for('operations_login') }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <input type="hidden" name="username" value="admin" autocomplete="username">
    <label for="operations_password">관리자 비밀번호</label>
    <input id="operations_password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">운영 관리 접속</button>
  </form>
  <p class="meta"><a href="{{ url_for('dashboard') }}">대시보드로 돌아가기</a></p>
</section>
{% endblock %}
