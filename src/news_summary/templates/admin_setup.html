{% extends "base.html" %}
{% block content %}
<section class="auth-panel">
  <h1>관리자 설정</h1>
  {% if auth_state.enabled %}
    <p class="meta">현재 관리자 로그인이 활성화되어 있습니다. 새 비밀번호를 저장하면 다음 로그인부터 적용됩니다.</p>
  {% else %}
    <p class="meta">비밀번호를 설정하면 관리자 로그인이 활성화됩니다. 공개 링크를 만들기 전에 반드시 설정하세요.</p>
  {% endif %}
  <form method="post" action="{{ url_for('admin_setup') }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <input type="hidden" name="username" value="admin" autocomplete="username">
    <label for="password">새 관리자 비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirm_password">비밀번호 확인</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit">관리자 로그인 활성화</button>
  </form>
</section>
{% endblock %}
