[project]
name = "news-summary"
version = "0.1.0"
description = "광주·전남 지자체 보도자료를 수집하고 방송 단신 기사 초안을 생성합니다."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "flask>=3.0.3",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

[project.scripts]
news-summary = "news_summary.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_summary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
