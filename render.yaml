services:
  - type: web
    name: news-express
    runtime: python
    plan: starter
    # 한국 지자체 사이트(강진 등)가 미국 데이터센터 IP를 차단하는 경우가 있어
    # 한국과 가까운 싱가포르 리전을 사용한다. Neon DB(ap-southeast-1)와도 가깝다.
    # 참고: 기존 서비스의 리전은 변경 불가 — 이 값은 새로 만드는 서비스에만 적용된다.
    region: singapore
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - src/**
        - config/**
        - scripts/**
        - templates/**
        - pyproject.toml
        - render.yaml
    buildCommand: pip install -e .
    startCommand: gunicorn --workers 1 --threads 8 --timeout 180 --bind 0.0.0.0:$PORT news_summary.wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWS_SUMMARY_SECRET_KEY
        generateValue: true
      - key: NEWS_SUMMARY_ADMIN_PASSWORD_HASH
        sync: false
      # 운영 관리 진입 전용 비밀번호(해시). Render 대시보드에서 직접 입력한다.
      - key: NEWS_SUMMARY_OPERATIONS_PASSWORD_HASH
        sync: false
      - key: NEWS_SUMMARY_AUTH_REQUIRED
        value: "1"
      - key: NEWS_SUMMARY_AUTH_DISABLED
        value: "0"
      - key: NEWS_SUMMARY_AUTO_COLLECT
        value: "1"
      - key: NEWS_SUMMARY_AUTO_COLLECT_LIMIT
        value: "30"
      - key: NEWS_SUMMARY_AUTO_DRAFT_LIMIT
        value: "250"
      - key: NEWS_SUMMARY_AUTO_REQUIRE_GEMINI
        value: "1"
      - key: NEWS_SUMMARY_AUTO_QUEUE_DRAIN
        value: "1"
      - key: NEWS_SUMMARY_AUTO_QUEUE_DRAIN_INTERVAL_SECONDS
        value: "900"
      - key: NEWS_SUMMARY_AUTO_QUEUE_DRAIN_LIMIT
        value: "25"
      - key: NEWS_SUMMARY_AUTO_RECOVERY_INTERVAL_SECONDS
        value: "900"
      - key: NEWS_SUMMARY_AUTO_RECOVERY_LIMIT
        value: "5"
      - key: NEWS_SUMMARY_AUTO_QUIET_SOURCE_RECHECK
        value: "1"
      - key: NEWS_SUMMARY_AUTO_QUIET_SOURCE_RECHECK_HOUR
        value: "9"
      - key: NEWS_SUMMARY_AUTO_FOCUSED_RECRAWL_LIMIT
        value: "3"
      - key: NEWS_SUMMARY_AUTO_ANOMALY_CHECK_HOUR
        value: "10"
      - key: NEWS_SUMMARY_AUTO_DEDUPLICATE
        value: "1"
      - key: NEWS_SUMMARY_AUTO_DEDUPLICATE_LIMIT
        value: "50"
      - key: NEWS_SUMMARY_AUTO_URL_DISCOVERY_LIMIT
        value: "3"
      - key: NEWS_SUMMARY_AUTO_BACKUP_CREATE
        value: "1"
      - key: NEWS_SUMMARY_AUTO_BACKUP_MAX_AGE_HOURS
        value: "24"
      - key: NEWS_SUMMARY_AUTO_BACKUP_KEEP_COUNT
        value: "7"
      - key: NEWS_SUMMARY_AUTO_BACKUP_VERIFY
        value: "1"
      - key: NEWS_SUMMARY_PUBLIC_URL
        value: https://news-express-1.onrender.com
      - key: NEWS_SUMMARY_GEMINI_FAILURE_RETRY_SECONDS
        value: "900"
      - key: NEWS_SUMMARY_GITHUB_REPO
        value: seunghooda-dev/news-express
      - key: NEWS_SUMMARY_GITHUB_BRANCH
        value: codex/news-express
      - key: NEWS_SUMMARY_GEMINI_SOURCE_MAX_CHARS
        value: "2400"
      - key: NEWS_SUMMARY_RETENTION_DAYS
        value: "3"
      - key: NEWS_SUMMARY_LOG_DIR
        value: /tmp/news-express/logs
      - key: NEWS_SUMMARY_BACKUP_DIR
        value: /tmp/news-express/backups
      - key: NEWS_SUMMARY_BACKUP_INCLUDE_ENV
        value: "0"
      - key: NEWS_SUMMARY_CONFIG
        value: config/municipalities.yaml
